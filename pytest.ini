[pytest]
# ADK-NPL Test Suite Configuration

# Default test paths
testpaths = tests

# Async mode for async tests (pytest-asyncio)
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    asyncio: mark test as async
    slow: mark test as slow (may hit API limits)
    integration: mark test as integration test (requires NPL Engine)
    a2a: mark test as A2A communication test

# Output settings
addopts = 
    -v
    --tb=short
    -x
    --strict-markers

# Timeout for tests (seconds)
timeout = 120

# Logging
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
